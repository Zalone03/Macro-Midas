<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- shapes -->
    <path id="fingers" d="
      M140,392 C128,392 122,382 124,370 L162,180
      C170,138 200,120 226,132 C240,138 248,152 256,170
      C264,152 272,138 286,132 C312,120 342,138 350,180
      L388,370 C390,382 384,392 372,392 C362,392 356,386 354,378
      L314,226 C308,206 296,198 284,204 C272,210 266,222 262,238
      L256,262 L250,238 C246,222 240,210 228,204 C216,198 204,206 198,226
      L158,378 C156,386 150,392 140,392 Z"/>
    <path id="thumb" d="M182,212 C160,208 132,230 112,262 C102,278 106,294 120,298 C132,302 142,292 150,280 L180,244 Z"/>
    <path id="curl" d="M346,186 C362,178 386,188 386,210 C386,224 378,230 372,232 C390,240 390,266 372,270 C356,274 346,262 344,250 Z"/>
    <g id="handAll"><use href="#thumb"/><use href="#curl"/><use href="#fingers"/></g>

    <!-- paints -->
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="130" y1="110" x2="390" y2="400">
      <stop offset="0" stop-color="#F0DFB2"/><stop offset=".45" stop-color="#DCC07E"/><stop offset="1" stop-color="#C29E55"/>
    </linearGradient>
    <linearGradient id="goldBack" gradientUnits="userSpaceOnUse" x1="100" y1="190" x2="390" y2="300">
      <stop offset="0" stop-color="#C9A75E"/><stop offset="1" stop-color="#8E733F"/>
    </linearGradient>
    <linearGradient id="plastic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E3E42"/><stop offset=".6" stop-color="#252527"/><stop offset="1" stop-color="#18181A"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A6236"/><stop offset="1" stop-color="#3A2F1C"/>
    </linearGradient>
    <linearGradient id="keyTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46464A"/><stop offset="1" stop-color="#2E2E31"/>
    </linearGradient>
    <linearGradient id="keyGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0DFB2"/><stop offset="1" stop-color="#C9A75E"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#E6CF95" stop-opacity=".75"/><stop offset="1" stop-color="#E6CF95" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".38" r=".75">
      <stop offset="0" stop-color="#1D1D1F"/><stop offset="1" stop-color="#0C0C0D"/>
    </radialGradient>

    <filter id="b4" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="b8" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="b14" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>

    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
    <clipPath id="handClip"><use href="#thumb"/><use href="#curl"/><use href="#fingers"/></clipPath>

    <!-- inner shadow (light from top-left) -->
    <mask id="shadeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <use href="#handAll" transform="translate(-13,-9)" fill="#000" filter="url(#b8)"/>
    </mask>
    <!-- inner highlight -->
    <mask id="lightMask" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <use href="#handAll" transform="translate(9,7)" fill="#000" filter="url(#b4)"/>
    </mask>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#vignette)"/>

  <g clip-path="url(#tile)">
    <!-- ===== MOUSE ===== -->
    <g transform="translate(166,388) rotate(30)">
      <rect x="-50" y="10" width="150" height="230" rx="75" fill="#000" opacity=".7" filter="url(#b14)"/>
      <rect x="-62" y="-14" width="150" height="230" rx="75" fill="url(#side)" transform="translate(9,18)"/>
      <rect x="-62" y="-14" width="150" height="230" rx="75" fill="url(#plastic)"/>
      <rect x="-60.5" y="-12.5" width="147" height="227" rx="73.5" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="3"/>
      <!-- pressed left button: sunk + lit -->
      <path d="M13,-14 V74 H-62 V61 A75,75 0 0 1 13,-14 Z" fill="#7E6638"/>
      <path d="M13,-6 V74 H-54 V61 A67,67 0 0 1 13,-6 Z" fill="url(#keyGold)" opacity=".85"/>
      <path d="M13,-14 V74 H88 V61 A75,75 0 0 0 13,-14 Z" fill="#38383B"/>
      <rect x="9" y="-14" width="8" height="88" fill="#0E0E0F"/>
      <rect x="-62" y="72" width="150" height="7" fill="#0E0E0F" opacity=".8"/>
      <rect x="2" y="8" width="22" height="42" rx="11" fill="#0E0E0F"/>
      <rect x="6" y="12" width="14" height="30" rx="7" fill="url(#keyGold)"/>
      <!-- specular sheen -->
      <ellipse cx="50" cy="120" rx="22" ry="70" fill="#fff" opacity=".05"/>
    </g>

    <!-- ===== KEYBOARD ===== -->
    <g transform="translate(352,388) rotate(-24) skewX(12)">
      <rect x="-48" y="0" width="300" height="170" rx="16" fill="#000" opacity=".7" filter="url(#b14)"/>
      <rect x="-60" y="-28" width="300" height="170" rx="16" fill="url(#side)" transform="translate(0,18)"/>
      <rect x="-60" y="-28" width="300" height="170" rx="16" fill="url(#plastic)"/>
      <rect x="-58.5" y="-26.5" width="297" height="167" rx="14.5" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="3"/>
            <!-- keys: side (depth) + top -->
      <g>
        <g fill="#0B0B0C">
          <rect x="-44" y="-4" width="38" height="34" rx="7"/><rect x="48" y="-4" width="38" height="34" rx="7"/>
          <rect x="94" y="-4" width="38" height="34" rx="7"/><rect x="140" y="-4" width="38" height="34" rx="7"/>
          <rect x="-26" y="42" width="38" height="34" rx="7"/><rect x="20" y="42" width="38" height="34" rx="7"/>
          <rect x="66" y="42" width="38" height="34" rx="7"/><rect x="112" y="42" width="38" height="34" rx="7"/>
          <rect x="-10" y="88" width="38" height="34" rx="7"/><rect x="36" y="88" width="130" height="34" rx="7"/>
        </g>
        <g fill="url(#keyTop)">
          <rect x="-44" y="-12" width="38" height="34" rx="7"/><rect x="48" y="-12" width="38" height="34" rx="7"/>
          <rect x="94" y="-12" width="38" height="34" rx="7"/><rect x="140" y="-12" width="38" height="34" rx="7"/>
          <rect x="-26" y="34" width="38" height="34" rx="7"/><rect x="20" y="34" width="38" height="34" rx="7"/>
          <rect x="66" y="34" width="38" height="34" rx="7"/><rect x="112" y="34" width="38" height="34" rx="7"/>
          <rect x="-10" y="80" width="38" height="34" rx="7"/><rect x="36" y="80" width="130" height="34" rx="7"/>
        </g>
        <!-- pressed key: sunk, gold, glowing -->
        <rect x="2" y="-12" width="38" height="38" rx="7" fill="#0B0B0C"/>
        <rect x="2" y="-7" width="38" height="34" rx="7" fill="url(#keyGold)"/>
      </g>
    </g>

    <!-- click glows -->
    <circle cx="140" cy="392" r="34" fill="url(#glow)" opacity=".7"/>
    <circle cx="374" cy="392" r="34" fill="url(#glow)" opacity=".7"/>

    <!-- hand cast shadow on the desk/devices -->
    <use href="#handAll" transform="translate(16,22)" fill="#000" opacity=".6" filter="url(#b14)"/>
  </g>

  <!-- ===== HAND ===== -->
  <use href="#thumb" fill="url(#goldBack)"/>
  <use href="#curl" fill="url(#goldBack)"/>
  <!-- occlusion where fingers overlap thumb / curled fingers -->
  <g clip-path="url(#handClip)">
    <use href="#fingers" fill="#000" opacity=".45" filter="url(#b8)" transform="translate(4,6)"/>
  </g>
  <use href="#fingers" fill="url(#gold)"/>

  <!-- volume: inner shadow + inner highlight -->
  <g clip-path="url(#handClip)">
    <rect width="512" height="512" fill="#3E2C10" opacity=".85" mask="url(#shadeMask)"/>
    <rect width="512" height="512" fill="#FFF6DC" opacity=".55" mask="url(#lightMask)"/>
  </g>

  <!-- nails (soft, glossy) -->
  <g fill="#FBF1D6" opacity=".85">
    <path d="M132,366 C130,356 138,348 146,350 C152,352 154,360 152,368 C150,376 134,376 132,366 Z"/>
    <path d="M380,366 C382,356 374,348 366,350 C360,352 358,360 360,368 C362,376 378,376 380,366 Z"/>
    <path d="M110,282 C110,272 118,266 126,270 C132,274 130,284 124,290 C118,294 110,290 110,282 Z" opacity=".8"/>
  </g>

  <!-- tile rim -->
  <rect x="21" y="21" width="470" height="470" rx="107" fill="none" stroke="url(#gold)" stroke-width="5" opacity=".85"/>
</svg>
