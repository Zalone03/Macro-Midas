<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 100 392 340" width="392" height="340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
