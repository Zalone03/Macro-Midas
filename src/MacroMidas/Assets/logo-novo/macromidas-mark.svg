  <mask id="tube" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
    <path d="M164,338 L184,170 Q190,138 214,138 Q236,138 242,164 L256,226 L270,164 Q276,138 298,138 Q322,138 328,170 L348,338" fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
